services:
  hotnews-crawler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: hotnews_crawler
    restart: unless-stopped
    network_mode: host
    volumes:
      # 挂载数据目录（持久化数据库和日志）
      - ./data:/app/data
      - ./logs:/app/logs
      # 挂载环境变量文件（包含API密钥）
      - ./.env:/app/.env
    environment:
      - TZ=Asia/Shanghai

  mcp-server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: hotnews_mcp_server
    restart: unless-stopped
    network_mode: host
    volumes:
      # 挂载环境变量文件（包含API密钥）
      - ./.env:/app/.env
    environment:
      - TZ=Asia/Shanghai
    # MCP服务启动命令
    command: ["python", "mcp_server.py"]
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
