version: '3.8'

services:
  hotnews-crawler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: hotnews_crawler
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # 挂载数据目录（持久化数据库和日志）
      - ./data:/app/data
      - ./logs:/app/logs
      # 挂载环境变量文件（包含API密钥）
      - ./.env:/app/.env
    environment:
      - TZ=Asia/Shanghai
    networks:
      - hotnews-network

  mcp-server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: hotnews_mcp_server
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      # 挂载环境变量文件（包含API密钥）
      - ./.env:/app/.env
    environment:
      - TZ=Asia/Shanghai
    # 依赖Web服务先启动
    depends_on:
      - hotnews-crawler
    networks:
      - hotnews-network
    # MCP服务启动命令
    command: ["python", "mcp_server.py"]
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  hotnews-network:
    driver: bridge
