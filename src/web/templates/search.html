{% extends "base.html" %}

{% block title %}搜索 - 热点新闻爬虫{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <h2 class="mb-3">🔍 搜索新闻</h2>

        <div class="card mb-4">
            <div class="card-body">
                <form id="searchForm" class="row g-3">
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="keyword" placeholder="输入关键词...">
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="source">
                            <option value="">全部来源</option>
                            {% for s in sources %}
                            <option value="{{ s }}">{{ s }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-2">
                        <input type="date" class="form-control" id="startDate">
                    </div>
                    <div class="col-md-2">
                        <input type="date" class="form-control" id="endDate">
                    </div>
                    <div class="col-md-1">
                        <button type="submit" class="btn btn-primary w-100">搜索</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div id="searchResults">
                    <p class="text-muted">请输入关键词进行搜索</p>
                </div>
                <div id="pagination"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 0;
let currentQuery = {};

document.getElementById('searchForm').addEventListener('submit', function(e) {
    e.preventDefault();
    currentPage = 0;
    searchNews();
});

function searchNews() {
    const keyword = document.getElementById('keyword').value;
    const source = document.getElementById('source').value;
    const startDate = document.getElementById('startDate').value;
    const endDate = document.getElementById('endDate').value;

    currentQuery = {
        keyword: keyword,
        source: source,
        start_date: startDate,
        end_date: endDate,
        limit: 20,
        offset: currentPage * 20
    };

    const params = new URLSearchParams(currentQuery);
    fetch(`/api/news?${params}`)
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                displayResults(data.data);
                displayPagination(data.total, data.limit, data.offset);
            } else {
                document.getElementById('searchResults').innerHTML =
                    `<div class="alert alert-danger">搜索失败: ${data.error}</div>`;
            }
        })
        .catch(err => {
            console.error(err);
            document.getElementById('searchResults').innerHTML =
                '<div class="alert alert-danger">搜索失败，请稍后重试</div>';
        });
}

function displayResults(news) {
    if (news.length === 0) {
        document.getElementById('searchResults').innerHTML =
            '<p class="text-muted">未找到相关新闻</p>';
        return;
    }

    let html = '<div class="list-group">';
    news.forEach(item => {
        html += `
            <a href="${item.url}" target="_blank" class="list-group-item list-group-item-action">
                <div class="d-flex w-100 justify-content-between">
                    <h6 class="mb-1">${item.title}</h6>
                    <small>${item.crawled_at.substring(0, 16)}</small>
                </div>
                <p class="mb-1">
                    <span class="badge bg-secondary">${item.source}</span>
                    <span class="badge bg-info">排名 ${item.rank}</span>
                </p>
            </a>
        `;
    });
    html += '</div>';

    document.getElementById('searchResults').innerHTML = html;
}

function displayPagination(total, limit, offset) {
    const totalPages = Math.ceil(total / limit);
    if (totalPages <= 1) {
        document.getElementById('pagination').innerHTML = '';
        return;
    }

    let html = '<nav aria-label="Page navigation"><ul class="pagination justify-content-center">';
    html += `<li class="page-item ${currentPage === 0 ? 'disabled' : ''}">
        <a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;">上一页</a>
    </li>`;

    for (let i = 0; i < totalPages; i++) {
        if (i < 5 || i >= totalPages - 2 || Math.abs(i - currentPage) < 2) {
            html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                <a class="page-link" href="#" onclick="changePage(${i}); return false;">${i + 1}</a>
            </li>`;
        } else if (i === 5 || i === totalPages - 3) {
            html += '<li class="page-item disabled"><a class="page-link" href="#">...</a></li>';
        }
    }

    html += `<li class="page-item ${currentPage >= totalPages - 1 ? 'disabled' : ''}">
        <a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;">下一页</a>
    </li>`;
    html += '</ul></nav>';

    document.getElementById('pagination').innerHTML = html;
}

function changePage(page) {
    currentPage = page;
    searchNews();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
{% endblock %}
