<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}热点新闻爬虫{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
        }
        .card {
            border: none;
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
            margin-bottom: 20px;
        }
        .news-item {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .news-item:last-child {
            border-bottom: none;
        }
        .news-rank {
            display: inline-block;
            width: 24px;
            height: 24px;
            line-height: 24px;
            text-align: center;
            background-color: #6c757d;
            color: white;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 8px;
        }
        .news-rank.top-3 {
            background-color: #ffc107;
        }
        .stats-card {
            text-align: center;
            padding: 20px;
        }
        .stats-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #0d6efd;
        }
        .stats-label {
            color: #6c757d;
            margin-top: 10px;
        }
        /* AI 精选新闻样式 */
        .curated-news-item {
            background-color: #f8fff9;
            border-radius: 8px;
            padding: 15px !important;
            margin-bottom: 10px;
            border-left: 4px solid #198754;
            transition: all 0.3s ease;
        }
        .curated-news-item:hover {
            background-color: #f0fff4;
            border-left-width: 6px;
            box-shadow: 0 2px 8px rgba(25, 135, 84, 0.15);
        }
        .curated-news-item h6 a {
            color: #212529;
            text-decoration: none;
            font-weight: 500;
        }
        .curated-news-item h6 a:hover {
            color: #198754;
        }
        .badge.bg-success {
            background-color: #198754 !important;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">🔥 热点新闻爬虫</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/search">搜索</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/stats">统计</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <footer class="text-center mt-5 py-3 text-muted">
        <small>热点新闻爬虫 | 更新时间: {{ current_time }}</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.0/dist/echarts.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
